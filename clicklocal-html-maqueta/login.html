<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | ClickLocal</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header class="header">
    <div class="header-contenedor">
      <div class="logo-zona">
        <div class="logo-circulo">C</div>

        <div>
          <h1 class="logo-texto">ClickLocal</h1>
          <p class="ciudad">📍 Paraná</p>
        </div>
      </div>

      <nav class="nav">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="registro.html" class="boton-secundario">Crear cuenta</a>
      </nav>
    </div>
  </header>


  <main class="auth-main">

    <section class="auth-card">

      <div class="auth-encabezado">
        <p class="titulo-chico">MI COMERCIO</p>
        <h1>Ingresar a mi comercio</h1>
        <p>
          Entrá para cargar publicaciones, editar tus listas buscables y administrar tu vidriera.
        </p>
      </div>

      <form class="formulario">

        <div class="campo">
          <label>Email</label>
          <input type="email" placeholder="tunegocio@email.com" />
        </div>

        <div class="campo">
          <label>Contraseña</label>
          <input type="password" placeholder="Ingresá tu contraseña" />
        </div>

        <button type="button" class="boton-principal-form">
          Ingresar
        </button>

        <a href="#" class="boton-form-secundario">
          Olvidé mi contraseña
        </a>

        <p class="auth-ayuda">
          ¿Todavía no publicás en ClickLocal?
          <a href="registro.html">Crear cuenta</a>
        </p>

      </form>

    </section>

  </main>

</body>
</html>
