<!DOCTYPE html>
<html lang="es">
<head>
    <!-- PWA / App instalable -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#ff7a00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ClickLocal">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <meta charset="UTF-8">
    <title>Admin - ClickLocal</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<main style="max-width: 420px; margin: 80px auto; padding: 24px;">
    <h1>Panel de administración</h1>
    <p>Ingresá con el usuario administrador.</p>

    {% if error %}
        <div style="background:#ffe5e5; color:#8a0000; padding:12px; border-radius:8px; margin-bottom:16px;">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/admin/login">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required style="width:100%; padding:10px; margin:8px 0 16px;">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required style="width:100%; padding:10px; margin:8px 0 16px;">

        <button type="submit" style="width:100%; padding:12px;">
            Entrar al admin
        </button>
    </form>

    <p style="margin-top:20px;">
        <a href="/index.html">Volver al inicio</a>
    </p>
</main>

</body>
</html>
