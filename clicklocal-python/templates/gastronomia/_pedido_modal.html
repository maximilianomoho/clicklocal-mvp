<dialog class="pedido-modal" id="pedidoDetalleModal" aria-labelledby="pedidoModalTitulo">
<div class="pedido-modal-contenido">

      <h2 id="pedidoModalTitulo">Detalle del pedido</h2>
      <p id="pedidoModalEstados"></p>
    </div>
